[project]
name = "build123d-workspace"
version = "0.1.0"
description = "AI-assisted parametric CAD with validated exports and offline previews"
requires-python = ">=3.14,<3.15"
dependencies = [
  "build123d==0.13.0",
  "matplotlib>=3.10,<4",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "plotly>=6,<7",
  "qrcode>=8,<9",
  "trimesh>=4.6,<5",
  "zxing-cpp>=2.3,<4",
]

[tool.uv]
package = false

[dependency-groups]
docs = [
    "sphinx==8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-llms-txt>=0.7.1,<0.8",
    "sphinx-mathjax-offline==0.0.2",
    "sphinx-rtd-theme>=3.1.0",
]
